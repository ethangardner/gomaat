version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it, so a compromised or
    # yanked version is more likely to be caught first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it, so a compromised or
    # yanked version is more likely to be caught first.
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ['*']
