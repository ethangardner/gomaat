name: Benchmarks

on:
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bench.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          path: head
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin v7.0.0
        with:
          go-version-file: head/go.mod
          cache-dependency-path: head/go.sum

      # Base and head runs alternate so drift in the shared runner's load
      # spreads over both sides instead of skewing one.
      - name: run benchmarks
        run: |
          base_failed=false
          for _ in 1 2 3 4 5 6; do
            (cd base && go test -run '^$' -bench . -benchmem -count 1 ./... >> "$RUNNER_TEMP/base.txt") ||
              base_failed=true
            (cd head && go test -run '^$' -bench . -benchmem -count 1 ./... >> "$RUNNER_TEMP/head.txt")
          done
          if [ "$base_failed" = true ]; then
            echo "::warning::benchmarks failed on the base commit"
          fi

      # Informational only: shared runners are too noisy to gate on a delta.
      - name: compare with benchstat
        run: |
          # Run benchstat outside the pipe below, whose exit status is tee's, so
          # a failure (e.g. a module proxy hiccup) warns instead of leaving an
          # empty block that reads as a result.
          if ! (cd head && go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da \
            base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt") > "$RUNNER_TEMP/benchstat.txt" 2>&1; then
            echo "::warning::benchstat failed; its output is in the job summary"
          fi
          {
            echo "## Benchmarks: base vs. PR"
            echo
            echo "Six alternating runs each on a shared runner; treat small deltas as noise."
            echo
            echo '```'
            cat "$RUNNER_TEMP/benchstat.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
