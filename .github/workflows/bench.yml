name: Benchmarks

on:
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bench.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin v6.0.2
        with:
          path: head
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # pin v6.4.0
        with:
          go-version-file: head/go.mod
          cache-dependency-path: head/go.sum

      # Base and head runs alternate so drift in the shared runner's load
      # spreads over both sides instead of skewing one.
      - name: run benchmarks
        run: |
          for _ in 1 2 3 4 5 6; do
            (cd base && go test -run '^$' -bench . -benchmem -count 1 ./... >> "$RUNNER_TEMP/base.txt") ||
              echo "::warning::benchmarks failed on the base commit"
            (cd head && go test -run '^$' -bench . -benchmem -count 1 ./... >> "$RUNNER_TEMP/head.txt")
          done

      # Informational only: shared runners are too noisy to gate on a delta.
      - name: compare with benchstat
        run: |
          {
            echo "## Benchmarks: base vs. PR"
            echo
            echo "Six alternating runs each on a shared runner; treat small deltas as noise."
            echo
            echo '```'
            (cd head && go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da \
              base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt")
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
