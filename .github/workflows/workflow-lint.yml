name: Lint workflows

on:
  push:
    branches: [main]
    paths: ['.github/**']
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

concurrency:
  # A PR's runs share a group, so a new push cancels the superseded run. Other
  # events are keyed by commit: GitHub keeps only one pending run per group,
  # so a shared group would drop all but the latest of several queued pushes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # actionlint also runs shellcheck over run: blocks when it's on PATH,
      # which it is on ubuntu runners.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # pin v0.6.4
        with:
          # Report in the log instead of uploading SARIF, which would need
          # security-events: write.
          advanced-security: false
          # The action defaults to the latest zizmor. Pin the tool too (commit
          # 99a054ed9283c90abdd2d5b9fb5101d27dde9783); the action pulls its
          # image by the digest listed for this version in support/versions.
          version: 1.30.1
