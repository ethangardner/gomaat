name: Fuzz

on:
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:
    paths:
      - 'internal/parser/**'
      - 'internal/gitdiff/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/parser
            target: FuzzParseReader
          - pkg: ./internal/gitdiff
            target: FuzzParse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin v7.0.0
        with:
          go-version-file: go.mod

      # Seed corpora already run in every `go test`; this explores beyond
      # them. Short on PRs, longer on the weekly schedule.
      - name: fuzz ${{ matrix.target }}
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ github.event_name == 'pull_request' && '30s' || '10m' }}
        run: go test "$PKG" -run '^$' -fuzz "^$TARGET$" -fuzztime "$FUZZTIME"

      # A failing input is written under testdata/fuzz; commit it to the
      # package to make it a permanent regression test.
      - name: upload failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz
