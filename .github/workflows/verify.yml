name: Verify formatting, linting, and testing

on:
  push:
    branches: [main]
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:

permissions:
  contents: read

concurrency:
  # A PR's runs share a group, so a new push cancels the superseded run. Other
  # events are keyed by commit: GitHub keeps only one pending run per group,
  # so a shared group would drop all but the latest of several queued pushes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin v7.0.0
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - name: fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # goreleaser's before hook runs `go mod tidy`, so an untidy module would
      # otherwise only surface at release time.
      - name: tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'make tidy' and commit the result."
            exit 1
          fi
          go mod verify

      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # pin v9.3.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin v7.0.0
        with:
          go-version-file: go.mod

      - name: test
        # bash on every OS: PowerShell splits -coverprofile=coverage.out at the dot.
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out
