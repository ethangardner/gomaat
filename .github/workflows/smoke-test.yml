name: Smoke Test Diff

on:
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pin v6.0.3
        with:
          ref: main
          fetch-depth: 0
          path: main
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pin v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          path: pr
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # pin v6.4.0
        with:
          go-version-file: main/go.mod

      - name: Build gomaat from main
        run: make -C main build

      - name: Build gomaat from PR
        run: make -C pr build

      - name: Generate shared log from main branch history
        run: main/bin/gomaat generate-log --path main --outfile gomaat.log

      # Both builds run the PR's copy of the script, so a PR that adds a
      # command also adds it to the comparison (main's build reports the
      # error, which shows up in the diff).
      - name: Run analyses with main build
        run: pr/.github/smoke-test/run.sh main/bin/gomaat gomaat.log main out/main

      - name: Run analyses with PR build
        run: pr/.github/smoke-test/run.sh pr/bin/gomaat gomaat.log main out/pr

      - name: Diff outputs
        id: diff
        run: |
          # Row order within each analysis isn't guaranteed to be stable across
          # processes (map iteration order), so sort before comparing. No -r
          # limit is used so the compared sets are complete and deterministic.
          # JSON is pretty-printed (multi-line per record), so it's flattened
          # to one compact object per line with jq first; anything jq can't
          # parse (e.g. an error from a command one build lacks) sorts as text.
          normalize() {
            if [ ! -e "$1" ]; then
              return
            elif [[ "$1" == *.json ]] && jq -e . "$1" > /dev/null 2>&1; then
              jq -c '.[]' "$1" | sort
            else
              sort "$1"
            fi
          }
          changed=false
          : > diff.txt
          for f in $( (ls out/main; ls out/pr) | sort -u); do
            if ! diff -u -L "main/$f" -L "pr/$f" \
              <(normalize "out/main/$f") <(normalize "out/pr/$f") > "$RUNNER_TEMP/diff"; then
              changed=true
              {
                echo "### $f"
                echo '```diff'
                cat "$RUNNER_TEMP/diff"
                echo '```'
                echo
              } >> diff.txt
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "true" ]; then
            head -c 50000 diff.txt > diff.trunc.txt
            mv diff.trunc.txt diff.txt
          fi

      - name: Build comment body
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          {
            echo "## gomaat smoke test diff"
            echo
            echo "Comparison of every \`gomaat\` analysis run against \`main\`'s git history,"
            echo "using a build of \`main\` vs. a build of this PR."
            echo
            if [ "$CHANGED" = "true" ]; then
              echo "**Result: analysis output differs.** This is informational only."
              echo
              cat diff.txt
            else
              echo "**Result: no difference in analysis output.**"
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so the comment can't be posted there;
      # the job summary above still has the diff.
      - name: Post sticky comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # pin v3.0.4
        with:
          header: gomaat-smoke-test
          path: comment.md
