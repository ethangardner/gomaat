name: govulncheck

on:
  push:
    branches: [main]
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:
  schedule:
    # Weekly, so newly published advisories surface even without new commits.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # pin v1.1.0
        with:
          # Empty so go-version-file wins over the action's 'stable' default.
          go-version-input: ''
          go-version-file: go.mod
