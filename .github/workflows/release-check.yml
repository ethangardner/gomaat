name: Release check

# Catch a broken .goreleaser.yml or cross-compile on the PR that causes it,
# instead of after pushing a v* tag.
on:
  # Any base branch, so stacked PRs get this check too.
  pull_request:
    paths:
      - '.goreleaser.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'go.mod'
      - 'go.sum'
      - '**.go'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # pin v6.4.0
        with:
          go-version-file: go.mod
          # Mirror release.yml, which builds without a cache.
          cache: false

      # Same action and version constraint as release.yml.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # pin v7.2.1
        with:
          version: '~> v2'
          args: check

      - name: goreleaser snapshot build
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # pin v7.2.1
        with:
          version: '~> v2'
          args: release --snapshot --clean

      # The ldflags -X target must match cli.version, or releases silently
      # report the default version.
      - name: check version is stamped
        run: |
          out=$(dist/gomaat_linux_amd64_v1/gomaat --version)
          echo "$out"
          case "$out" in
            *SNAPSHOT*) ;;
            *) echo "release build doesn't report the goreleaser version; check ldflags in .goreleaser.yml"; exit 1 ;;
          esac
