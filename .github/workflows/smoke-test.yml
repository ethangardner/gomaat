name: Smoke Test Diff

on:
  # Any base branch, so stacked PRs (based on another PR's branch) get CI too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Compare against the PR's own base, not main, so a stacked PR's diff
      # shows only its own changes and not its parent's.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: base
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          path: pr
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin v7.0.0
        with:
          go-version-file: base/go.mod

      - name: Build gomaat from base
        run: make -C base build

      - name: Build gomaat from PR
        run: make -C pr build

      - name: Generate shared log from base branch history
        run: base/bin/gomaat generate-log --path base --outfile gomaat.log

      # Both builds run the PR's copy of the script, so a PR that adds a
      # command also adds it to the comparison (the base build reports the
      # error, which shows up in the diff).
      - name: Run analyses with base build
        run: pr/.github/smoke-test/run.sh base/bin/gomaat gomaat.log base out/base

      - name: Run analyses with PR build
        run: pr/.github/smoke-test/run.sh pr/bin/gomaat gomaat.log base out/pr

      - name: Diff outputs
        id: diff
        run: |
          # Row order within each analysis isn't guaranteed to be stable across
          # processes (map iteration order), so sort before comparing. No -r
          # limit is used so the compared sets are complete and deterministic.
          # JSON is pretty-printed (multi-line per record), so it's flattened
          # to one compact object per line with jq first; anything jq can't
          # parse (e.g. an error from a command one build lacks) sorts as text.
          normalize() {
            if [ ! -e "$1" ]; then
              return
            elif [[ "$1" == *.json ]] && jq -e . "$1" > /dev/null 2>&1; then
              jq -c '.[]' "$1" | sort
            else
              sort "$1"
            fi
          }
          changed=false
          : > diff.txt
          for f in $( (ls out/base; ls out/pr) | sort -u); do
            if ! diff -u -L "base/$f" -L "pr/$f" \
              <(normalize "out/base/$f") <(normalize "out/pr/$f") > "$RUNNER_TEMP/diff"; then
              changed=true
              {
                echo "### $f"
                echo '```diff'
                cat "$RUNNER_TEMP/diff"
                echo '```'
                echo
              } >> diff.txt
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "true" ]; then
            head -c 50000 diff.txt > diff.trunc.txt
            mv diff.trunc.txt diff.txt
          fi

      - name: Build comment body
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "## gomaat smoke test diff"
            echo
            echo "Comparison of every \`gomaat\` analysis run against the base branch's (\`$BASE_REF\`) git history,"
            echo "using a build of the base branch vs. a build of this PR."
            echo
            if [ "$CHANGED" = "true" ]; then
              echo "**Result: analysis output differs.** This is informational only."
              echo
              cat diff.txt
            else
              echo "**Result: no difference in analysis output.**"
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so the comment can't be posted there;
      # the job summary above still has the diff.
      - name: Post sticky comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # pin v3.0.5
        with:
          header: gomaat-smoke-test
          path: comment.md
